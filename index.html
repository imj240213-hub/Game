<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DZAKYDEV Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout: satu kartu login di tengah langit cerah, sinar matahari berputar di belakang, kilauan di kanvas. */
  :root {
    --sky-top: #4fc3ff;
    --sky-mid: #a8e6ff;
    --sky-low: #fff3b8;
    --sun: #ffc425;
    --sun-deep: #ff8a1f;
    --pink: #e0287a;
    --ink: #1b2a5c;
    --ink-soft: #46568a;
    --card: rgba(255, 255, 255, 0.86);
    --field: #ffffff;
    --line: #c9dcf5;
    --ok: #12905a;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky-top);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    overflow-x: hidden;
    position: relative;
  }
  .sky {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  }
  .rays {
    position: fixed; z-index: 0;
    left: 50%; top: 38%;
    width: 160vmax; height: 160vmax;
    margin: -80vmax 0 0 -80vmax;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.55) 0deg 8deg, rgba(255,255,255,0) 8deg 24deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%);
    mask-image: radial-gradient(circle, #000 0%, transparent 55%);
    animation: spin 90s linear infinite;
  }
  .sun {
    position: fixed; z-index: 0;
    left: 50%; top: 38%;
    width: 46vmin; height: 46vmin; max-width: 420px; max-height: 420px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #fffbe0 0%, #ffe27a 35%, rgba(255,196,37,0.55) 60%, rgba(255,196,37,0) 72%);
    animation: pulse 4s ease-in-out infinite;
  }
  .orb {
    position: fixed; z-index: 0; border-radius: 50%;
    filter: blur(2px);
    animation: bob 7s ease-in-out infinite;
  }
  .orb.a { width: 120px; height: 120px; left: 6%; top: 14%; background: radial-gradient(circle at 30% 30%, #fff, #ff9ccb 55%, rgba(255,79,154,0.2)); }
  .orb.b { width: 90px; height: 90px; right: 8%; top: 24%; background: radial-gradient(circle at 30% 30%, #fff, #8ef0ff 55%, rgba(0,200,255,0.2)); animation-delay: -2s; }
  .orb.c { width: 140px; height: 140px; right: 12%; bottom: 8%; background: radial-gradient(circle at 30% 30%, #fff, #ffe27a 55%, rgba(255,160,30,0.2)); animation-delay: -4s; }
  .orb.d { width: 70px; height: 70px; left: 12%; bottom: 14%; background: radial-gradient(circle at 30% 30%, #fff, #b7a6ff 55%, rgba(120,90,255,0.2)); animation-delay: -1s; }
  #sparkles { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { width: 100%; max-width: 420px; min-width: 0; }

  .brand { text-align: center; margin-bottom: 18px; }
  .brand .eyebrow {
    display: inline-block;
    font-weight: 800; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink); background: var(--sun);
    padding: 5px 12px; border-radius: 999px;
    box-shadow: 0 3px 0 var(--sun-deep);
  }
  h1 {
    margin: 12px 0 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(38px, 12vw, 58px);
    line-height: 1;
    letter-spacing: 0.02em;
    color: #fff;
    text-shadow: 0 3px 0 var(--pink), 0 6px 0 var(--ink), 0 12px 22px rgba(27,42,92,0.35), 0 0 30px rgba(255,255,255,0.9);
    animation: float 4.5s ease-in-out infinite;
    text-wrap: balance;
  }

  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 3px solid #fff;
    border-radius: 22px;
    padding: 24px 22px 22px;
    box-shadow: 0 0 0 4px rgba(255,196,37,0.55), 0 18px 50px rgba(27,42,92,0.25), 0 0 60px rgba(255,255,255,0.8);
  }
  .card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
  .card .sub { margin: 0 0 18px; color: var(--ink-soft); font-weight: 600; }

  form { display: grid; gap: 14px; }
  label.lbl { display: block; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .input {
    position: relative;
  }
  .input input {
    width: 100%; min-width: 0;
    font: inherit; font-weight: 700; color: var(--ink);
    background: var(--field);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 13px 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .input input::placeholder { color: #8c9bc0; font-weight: 600; }
  .input input:focus { outline: none; border-color: var(--sun-deep); box-shadow: 0 0 0 4px rgba(255,196,37,0.5); }
  .input input[aria-invalid="true"] { border-color: var(--pink); }
  .input.has-btn input { padding-right: 76px; }
  .toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: 13px; font-weight: 800; color: var(--ink);
    background: #eef5ff; border: 0; border-radius: 10px; padding: 7px 10px; cursor: pointer;
  }
  .toggle:hover { background: #dcebff; }
  .toggle:focus-visible, .btn:focus-visible, .link:focus-visible, .check input:focus-visible + .box { outline: 3px solid var(--ink); outline-offset: 2px; }
  .err { min-height: 18px; margin: 4px 0 0; font-size: 13px; font-weight: 700; color: var(--pink); }

  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
  .check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .check .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); background: #fff; display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .check input:checked + .box { background: var(--sun); border-color: var(--sun-deep); }
  .check input:checked + .box::after { content: ""; width: 6px; height: 11px; border: solid var(--ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .link { color: var(--ink); font-weight: 800; text-decoration: underline; text-decoration-color: var(--pink); text-underline-offset: 3px; background: none; border: 0; font-family: inherit; font-size: inherit; padding: 0; cursor: pointer; }

  .btn {
    position: relative; overflow: hidden;
    width: 100%;
    font-family: var(--display); font-size: 20px; letter-spacing: 0.06em;
    color: var(--ink);
    background: linear-gradient(180deg, #ffe46b 0%, var(--sun) 55%, var(--sun-deep) 100%);
    border: 0; border-radius: 16px;
    padding: 15px 18px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c76a0a, 0 12px 26px rgba(255,138,31,0.55), 0 0 28px rgba(255,214,70,0.9);
    transition: transform .12s, box-shadow .12s;
    animation: glow 2.4s ease-in-out infinite;
  }
  .btn::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.85), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c76a0a, 0 6px 16px rgba(255,138,31,0.5); }
  .btn.ghost {
    font-family: var(--body); font-weight: 800; font-size: 15px; letter-spacing: 0;
    background: #fff; color: var(--ink); animation: none;
    box-shadow: 0 4px 0 var(--line);
  }
  .btn.ghost::after { display: none; }

  .loading { display: none; text-align: center; padding: 6px 0 2px; }
  .loading.on { display: block; }
  .loading h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin-bottom: 6px; }
  .bar { height: 16px; border-radius: 999px; background: #fff; border: 2px solid var(--line); overflow: hidden; margin: 14px 0 8px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sun), var(--sun-deep), var(--pink)); border-radius: 999px; transition: width .2s linear; }
  .status { margin: 0 0 14px; color: var(--ink-soft); font-weight: 700; }
  .ready { color: var(--ok); }
  .foot { text-align: center; margin: 16px 0 0; font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }

  .switch { text-align: center; margin: 2px 0 0; font-weight: 700; color: var(--ink-soft); }
  .note { margin: 0 0 14px; padding: 9px 12px; border-radius: 12px; background: #e3f8ec; color: var(--ok); font-weight: 800; font-size: 14px; }
  .hint { margin: 4px 0 0; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.08); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes glow { 0%,100% { box-shadow: 0 6px 0 #c76a0a, 0 12px 26px rgba(255,138,31,0.5), 0 0 22px rgba(255,214,70,0.7); } 50% { box-shadow: 0 6px 0 #c76a0a, 0 14px 34px rgba(255,138,31,0.7), 0 0 42px rgba(255,230,110,1); } }
  @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  @media (prefers-reduced-motion: reduce) {
    .rays, .sun, .orb, h1, .btn, .btn::after { animation: none !important; }
  }
  [hidden] { display: none !important; }

  body.playing{overflow:hidden}
  body.playing .rays,body.playing .sun,body.playing .orb,body.playing #sparkles{display:none}
  #game{position:fixed;inset:0;z-index:20;background:#2b3a67;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
  #gc{display:block}
  .gm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(27,42,92,.8);text-align:center;color:#fff}
  .gm h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,44px);margin:0;text-shadow:0 3px 0 var(--pink)}
  .gm p{margin:0 0 6px;max-width:340px;white-space:pre-line;font-weight:700;line-height:1.4}
  .gm .btn{max-width:300px}
  .lb{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 18px 22px;background:rgba(27,42,92,.8);color:#fff;text-align:center}
  .lb>*{width:100%;max-width:340px;flex:none}
  .lb h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;text-shadow:0 3px 0 var(--pink)}
  .rm{margin:0;font-weight:800;letter-spacing:.08em;color:#ffe27a}
  .mp{display:flex;align-items:center;gap:8px;font-weight:800}
  .mp span{flex:1}
  .mp .btn{width:46px;padding:8px 0;font-size:14px}
  .mp .btn:disabled{opacity:.35;cursor:default}
  #slots{display:grid;gap:8px}
  .sl{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:2px solid transparent;border-radius:14px;padding:8px 12px;font-weight:800}
  .sl.me{border-color:var(--sun);background:rgba(255,196,37,.2)}
  .ln{font-family:var(--display);font-size:14px;color:#ffe27a;width:24px;text-align:left}
  .cc{width:18px;height:30px;border-radius:6px;border:2px solid #fff;display:block}
  .nm{flex:1;text-align:left}
  .bd{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.2)}
  .bd.ok{background:var(--ok)}
  .chat{min-height:58px;font-size:13px;text-align:left;font-weight:700;color:#cfe3ff}
  .chat b{color:#ffe27a}
  .lh{margin:0;font-size:13px;font-weight:700;line-height:1.4}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="rays" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<div class="orb c" aria-hidden="true"></div>
<div class="orb d" aria-hidden="true"></div>
<canvas id="sparkles" aria-hidden="true"></canvas>

<main>
  <div class="wrap">
    <header class="brand">
      <span class="eyebrow">Player 1 siap</span>
      <h1>DZAKYDEV</h1>
    </header>

    <section class="card" aria-labelledby="judul">
      <div id="formView">
        <h2 id="judul">Masuk ke game</h2>
        <p class="sub">Isi akunmu, lalu mulai petualangan.</p>
        <p class="note" id="loginNote" role="status" hidden></p>
        <form id="loginForm" novalidate>
          <div>
            <label class="lbl" for="username">Username</label>
            <div class="input"><input id="username" name="username" type="text" autocomplete="username" placeholder="contoh: dzaky_player" maxlength="24"></div>
            <p class="err" id="errUser" role="alert"></p>
          </div>
          <div>
            <label class="lbl" for="password">Password</label>
            <div class="input has-btn">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter">
              <button class="toggle" id="toggle" type="button" aria-controls="password" aria-pressed="false">Lihat</button>
            </div>
            <p class="err" id="errPass" role="alert"></p>
          </div>
          <div class="row">
            <label class="check" for="remember"><input id="remember" type="checkbox" checked><span class="box"></span>Ingat saya</label>
            <button class="link" id="forgot" type="button">Lupa password?</button>
          </div>
          <button class="btn" type="submit">MULAI GAME</button>
          <button class="btn ghost" id="guest" type="button">Main sebagai tamu</button>
          <p class="switch">Belum punya akun? <button class="link" id="toRegister" type="button">Buat akun</button></p>
        </form>
      </div>

      <div id="regView" hidden>
        <h2>Buat akun baru</h2>
        <p class="sub">Daftar gratis, lalu langsung bisa main.</p>
        <form id="regForm" novalidate>
          <div>
            <label class="lbl" for="regUser">Username</label>
            <div class="input"><input id="regUser" name="regUser" type="text" autocomplete="username" placeholder="huruf, angka, atau _" maxlength="24"></div>
            <p class="err" id="errRegUser" role="alert"></p>
          </div>
          <div>
            <label class="lbl" for="regPass">Password</label>
            <div class="input"><input id="regPass" name="regPass" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></div>
            <p class="err" id="errRegPass" role="alert"></p>
          </div>
          <div>
            <label class="lbl" for="regPass2">Ulangi password</label>
            <div class="input"><input id="regPass2" name="regPass2" type="password" autocomplete="new-password" placeholder="Ketik password lagi"></div>
            <p class="err" id="errRegPass2" role="alert"></p>
          </div>
          <button class="btn" type="submit">DAFTAR SEKARANG</button>
          <p class="switch">Sudah punya akun? <button class="link" id="toLogin" type="button">Masuk</button></p>
        </form>
      </div>

      <div class="loading" id="loadView" aria-live="polite">
        <h2 id="welcome">Selamat datang!</h2>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="barFill"></i></div>
        <p class="status" id="status">Menyiapkan dunia...</p>
        <button class="btn" id="play" type="button" hidden>MAIN SEKARANG</button>
        <button class="btn ghost" id="back" type="button">Kembali ke login</button>
      </div>
    </section>
    <p class="foot">Dibuat oleh DZAKYDEV</p>
  </div>
</main>

<div id="game" hidden><canvas id="gc"></canvas>
<div class="lb" id="lobby" hidden><h2>LOBBY</h2><p class="rm">RUANG <b id="rc"></b></p>
<div class="mp"><button class="btn ghost" id="mpl" type="button">&#9664;</button><span id="mapt"></span><button class="btn ghost" id="mpr" type="button">&#9654;</button></div>
<div id="slots"></div><div class="chat" id="chat"></div><p class="lh" id="lh"></p>
<button class="btn" id="rdy" type="button">SIAP!</button><button class="btn ghost" id="lx" type="button">Keluar</button></div>
<div class="gm" id="gm" hidden><h2 id="gt"></h2><p id="gp"></p><button class="btn" id="gb" type="button"></button><button class="btn ghost" id="gl" type="button">Kembali ke lobby</button><button class="btn ghost" id="gr" type="button" hidden>Mulai dari Level 1</button><button class="btn ghost" id="gx" type="button">Keluar</button></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},g=$('game'),c=$('gc'),x=c.getContext('2d');
var W=360,H=640,CY=500,L=[79,146,214,281],K=Math.PI*2,s=null,raf=0,last=0,run=false,best=0,unl=0,mode='new',sl=0,nid=0,ln=[1,0,2,3],rs=[0,0,0],rdy=false,rt=[],gt0=0;
var TIP='Semua mobil start sejajar di garis yang sama, jalur diacak adil. Ketuk kiri/kanan layar (atau panah) untuk pindah jalur, kumpulkan koin, hindari bom. Isi meter BOOST lalu tekan tombolnya (atau Spasi).';
var CH=['Gas bareng!','Siap, ayo mulai!','Awas bom ya!','Jalurku aman nih','Gak sabar nih!'];
/* LEVEL: t = target koin tim, v = kecepatan jelajah, b = peluang bom, gap = jarak antar baris. */
var LV=[
{n:'Desa Hijau',t:10,v:250,b:.60,gap:300,g1:'#3fae4f',g2:'#2f8f3f',rd:'#454b60',c1:'#fff',c2:'#e0287a'},
{n:'Gurun Pasir',t:16,v:285,b:.65,gap:285,g1:'#e8c46a',g2:'#d4a94c',rd:'#5b5350',c1:'#fff',c2:'#e0287a'},
{n:'Kota Malam',t:24,v:320,b:.70,gap:270,g1:'#1d2a4a',g2:'#16203a',rd:'#2b2f3d',c1:'#8ef0ff',c2:'#b7a6ff'},
{n:'Salju Beku',t:32,v:355,b:.75,gap:255,g1:'#e8f4ff',g2:'#cfe3f5',rd:'#5a6475',c1:'#fff',c2:'#4fc3ff'},
{n:'Gunung Api',t:40,v:390,b:.80,gap:240,g1:'#5a2a22',g2:'#3e1c17',rd:'#3a3333',c1:'#ffc425',c2:'#ff4d4d'}];
/* BOT: sk = peluang melihat bom, cd = waktu reaksi (detik), co = minat koin. Semua start & nyawa sama. */
var BOTS=[
{n:'Rani',c1:'#2f7fe0',c2:'#1b57a8',sk:.93,cd:.18,co:.8},
{n:'Bimo',c1:'#2fb36b',c2:'#1f8049',sk:.85,cd:.24,co:.9},
{n:'Tika',c1:'#8a63e8',c2:'#5e3fb5',sk:.9,cd:.2,co:1.2}];
try{best=+localStorage.getItem('dzakydev-best')||0;unl=Math.min(LV.length-1,+localStorage.getItem('dzakydev-lv')||0)}catch(e){}
function pn(){return (window.dzName||'Kamu').slice(0,10)}
function fit(){var S=Math.min(innerWidth/W,innerHeight/H),d=Math.min(devicePixelRatio||1,2);
c.style.width=W*S+'px';c.style.height=H*S+'px';c.width=W*S*d;c.height=H*S*d;x.setTransform(S*d,0,0,S*d,0,0);if(s)draw()}
function shuf(){var a=[0,1,2,3],i,j,t;for(i=3;i>0;i--){j=Math.random()*(i+1)|0;t=a[i];a[i]=a[j];a[j]=t}return a}
function mkBot(d,i){return{d:d,i:i,y:CY,l:ln[i+1],x:L[ln[i+1]],hp:3,inv:0,ko:0,co:0,cd:0,say:'',st:0,br:0,bk:0,tl:0}}
function reset(lv){nid=0;s={lv:lv,lc:0,lt:0,px:0,py:CY,tl:0,bm:0,bt:0,l:0,hp:3,d:0,co:0,v:0,it:[],fx:[],t:0,w:.9,inv:0,sh:0,off:0,ban:2.8,warn:0,bk:0,ph:'grid',cd:3.4,gt:0,gy:CY-50,bots:BOTS.map(mkBot)};grid()}
/* Garis start: semua mobil sejajar di y yang sama, diam, lalu lampu 3-2-1-GO. */
function grid(rsh){if(rsh)ln=shuf();s.ph='grid';s.cd=3.4;s.gt=0;s.v=0;s.it=[];s.fx=[];s.gy=CY-50;s.py=CY;s.bt=0;s.l=ln[0];s.px=L[s.l];s.tl=0;
s.bots.forEach(function(b,i){b.l=ln[i+1];b.x=L[b.l];b.y=CY;b.br=0;b.tl=0;b.bk=0})}
